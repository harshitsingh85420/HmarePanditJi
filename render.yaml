services:
  - type: web
    name: hmarepanditji-api
    runtime: node
    region: singapore
    plan: free
    # `pnpm --filter types build` is LOAD-BEARING: services/api is compiled and
    # run as plain Node, so every workspace package it requires at runtime must
    # ship built JS. packages/types shipped main=src/index.ts and took the API
    # down on boot. check-dist-runtime.mjs fails the build if that returns.
    buildCommand: npm i -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter db exec prisma generate && pnpm --filter db build && pnpm --filter types build && pnpm --filter api build && node services/api/scripts/check-dist-runtime.mjs
    # SCHEMA APPLICATION RUNS AS MIGRATIONS, 2026-07-29.
    #
    # It used to be:
    #   startCommand: (prisma db push --skip-generate || true) && start
    # Three things were wrong and all three bit:
    #   1. `db push` applies schema.prisma DDL and NEVER RUNS THE MIGRATION
    #      SQL, so the two-source fee backfill and the FK orphan pre-check were
    #      bypassed entirely — harmless on an empty table, silent on a full one.
    #   2. It writes NO row to _prisma_migrations. Production schema ran ahead
    #      of its recorded history for TWENTY DAYS (history stopped 2026-07-08
    #      while code from 07-13 read tables db push had silently created).
    #   3. `|| true` swallows a non-zero exit and hides schema failure behind a
    #      healthy-looking boot.
    # The history was reconciled by hand (4x `migrate resolve --applied`,
    # 2026-07-29) and now reads 12 migrations, schema up to date.
    #
    # preDeploy runs migrations AS migrations and FAILS THE DEPLOY if they
    # fail; startCommand does one thing. scripts/migrate-prod.sh is
    # `set -euo pipefail` and aborts on a missing DATABASE_URL.
    preDeployCommand: bash scripts/migrate-prod.sh
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    envVars:
      # D4: TTS speaking pace (0.5–2.0; default 1.15). sync:false — set the
      # value in the Render dashboard, and mirror it on Vercel for apps/pandit.
      - key: SARVAM_TTS_PACE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_DEV_MODE
        value: "true"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_TTS_SPEAKER
        sync: false
      - key: SHISHYA_LLM_MODEL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: NODE_VERSION
        value: "20"
